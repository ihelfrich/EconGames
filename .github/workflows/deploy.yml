name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Re-anchor the twin to the newest BLS releases every week (jobs reports
  # land on the first Friday of the month; Saturday catches them).
  schedule:
    - cron: '0 14 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Pull the latest releases from FRED
        # never fails the deploy: without FRED the committed snapshot is used
        run: python3 pipeline/refresh_releases.py || true

      - name: Pull the latest state releases (BLS LAUS via BLS or FRED)
        run: python3 pipeline/refresh_states.py || true

      - name: Build twin data
        run: |
          python3 pipeline/build_twin_data.py || {
            echo "Rebuild with the fresh pull failed; falling back to the committed snapshot";
            git checkout -- pipeline/snapshots;
            python3 pipeline/build_twin_data.py;
          }

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
