name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Twin data is reproducible from the pipeline
        run: |
          python3 pipeline/build_twin_data.py
          git diff --stat --exit-code -- public/twin-data/grid.json public/twin-data/releases.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
